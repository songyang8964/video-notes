[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "video-notes"
version = "0.2.0"
description = "Turn a local lecture or training video into an illustrated, shareable note (Markdown and Word), written with an assistant in a chat."
readme = "README.md"
requires-python = ">=3.10"
license-files = ["NOTICE"]
authors = [{ name = "songyang8964" }]
dependencies = [
    "av>=12",
    "numpy>=1.24",
    "pillow>=10",
    "scikit-image>=0.22",
    "scenedetect>=0.6.4",
    "opencv-python-headless>=4.8",
    "pypandoc-binary>=1.13",  # Word copy of the note
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]

[project.scripts]
video-notes = "video_notes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_notes = ["prompts/*.md"]
